<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATM</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <section class="log-in-section">
    <img src="img/card.jpg" alt="">
    <div class="log-in-items">
      <h1>LEMOYNE BANK</h1>
      <div class="input-section">
        <h2>Enter Details</h2>
        <div class="input-area">
          <input type="text" name="user-name" id="user-name" placeholder="Name" maxlength="20">
          <input type="text" name="user-pin" id="user-pin" maxlength="4" placeholder="PIN">
        </div>
      </div>
      <div class="log-in-info">
        <button id="log-in-btn">LOG IN</button>
        <p>Attempts Remaining: <span id="attempts-remaining">3</span></p>
      </div>
    </div>
  </section>

  <section class="dashboard hidden">

  </section>
</body>
</html>
